<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>لوحة التحكم – مخزن أبو سعيد</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;font-weight:600;max-width:560px;margin-inline:auto;padding-bottom:60px}
button{font:inherit;color:inherit;cursor:pointer}
input:not([type=checkbox]),select{width:100%;min-width:0;font:inherit;font-weight:600;background:#fff;color:#1b1b1b;border:3px solid var(--ink);border-radius:12px;padding:9px 12px}

.login h3{font-family:Lalezar,Cairo,sans-serif;font-weight:400;font-size:30px;margin:0}
.err{color:var(--red);font-size:13px;font-weight:800;min-height:18px;margin-top:8px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 14px 8px;border-bottom:3px solid var(--ink)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trow b{font-family:Lalezar,Cairo,sans-serif;font-weight:400;font-size:24px}
.trow span{display:flex;gap:8px;align-items:center}
.stt{font-size:12px;color:var(--mu);min-height:16px}

.pubb.hot{background:var(--red);animation:pl 1.4s infinite}
@keyframes pl{50%{transform:scale(1.05)}}
.pubb:disabled{opacity:.5}
.x{background:var(--ink);color:var(--bg);border:3px solid var(--ink);border-radius:50%;width:36px;height:36px;font-weight:800}
.tb{display:flex;gap:6px;margin-top:6px}

.tb button.on{background:var(--ink);color:var(--bg)}
#qw{margin-top:8px}
#qw input{padding:7px 12px}
#v{padding:6px 14px}
.sec{margin:16px 0}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sh b{font-family:Lalezar,Cairo,sans-serif;font-weight:400;font-size:22px}

.mini{background:var(--blue);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 12px;font-weight:800;font-size:13px;box-shadow:2px 2px 0 var(--ink)}

.it.off{opacity:.55}
.mb{width:42px;height:42px;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}
.tx{flex:1;min-width:0}.tx b{display:block;font-weight:800;font-size:15px}.tx small{color:var(--mu);font-size:12px}
.pr{font-family:Lalezar,Cairo,sans-serif;font-size:20px;color:var(--red);text-align:center;line-height:1}.pr small{display:block;font:600 10px Cairo;color:var(--mu)}
.sw{position:relative;margin:0;flex:none}.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;z-index:2}
.sw i{display:block;width:46px;height:26px;border:3px solid var(--ink);border-radius:99px;background:#bbb;position:relative;transition:.2s}
.sw i::after{content:"";position:absolute;top:1px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:.2s}
.sw input:checked+i{background:var(--green)}.sw input:checked+i::after{inset-inline-start:22px}
.emp{color:var(--mu);font-size:13px;text-align:center;margin:6px 0}
.card2{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:12px;margin:12px 0;box-shadow:4px 4px 0 var(--ink)}
.hint{font-size:12px;color:var(--mu);margin:4px 0 0}.hint a{color:var(--blue);font-weight:800}
.cr{display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px;margin-bottom:8px}

.ar{display:flex;flex-direction:column;gap:2px}.ar button{background:transparent;border:2px solid var(--ink);border-radius:6px;font-size:10px;padding:0 6px;line-height:1.4}
.del{background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:800}
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:flex-end}.ov.on{display:flex}
.pn{width:100%;max-width:560px;margin-inline:auto;max-height:94%;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.pn h2{font-family:Lalezar,Cairo,sans-serif;font-weight:400;font-size:26px;margin:0;display:flex;justify-content:space-between;align-items:center}
.r2{display:flex;gap:8px;align-items:flex-end}.r2>div{flex:1}
.sws{display:flex;gap:10px;flex-wrap:wrap}.swc{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);cursor:pointer}.swc.on{outline:4px solid var(--blue);outline-offset:2px}
.ck{display:flex;align-items:center;gap:8px;margin-top:14px}.ck input{width:22px;height:22px}
.big{flex:1;margin-top:16px;padding:11px;font-size:17px;border-radius:14px}
.toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px;text-align:center;font-weight:800;opacity:0;pointer-events:none;transition:opacity .3s}.toast.on{opacity:1}
.cred{text-align:center;font-size:12.5px;color:var(--mu);margin:22px 0 6px}.cred b{color:var(--ink);font-weight:800}
.mb{overflow:hidden}.mb img{width:100%;height:100%;object-fit:cover;display:block}
.ip{display:flex;gap:12px;align-items:center}.ipv{width:80px;height:80px;border:3px solid var(--ink);border-radius:14px;background:#fff;display:grid;place-items:center;font-size:32px;flex:none;overflow:hidden}.ipv img{width:100%;height:100%;object-fit:cover}
.ip .btns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.ip .pubb{margin:0;font-size:14px}
</style></head><body>

 ei=i;var p=i>=0?D.p[i]:['',c,'',0,PAL[0][1],PAL[0][2],'🥔',0,''];pal=0;eimg=p[8]||'';enew='';PAL.forEach(function(x,j){if(x[1]==p[4])pal=j});

async function pub(){
 if(D.cfg.phone.length<11){toast('رقم الواتساب ناقص، راجعه من الإعدادات');tab='s';render();return}
 if(DEMO){toast('ده عرض تجريبي، النشر بيشتغل بعد ربط Firebase');return}
 var b=$('pub');b.disabled=true;D.v=(D.v||0)+1;var A='https://'+FB.db+'/chips/',used={};
 D.p.forEach(function(p){if(p[8])used[p[8]]=1});
 try{
  for(var k in PEND){if(used[k]){var r0=await fetch(A+'img/'+k+'.json?auth='+TK,{method:'PUT',body:JSON.stringify(IMG[k])});if(!r0.ok)throw 0}}
  PEND={};
  var r=await fetch(A+'data.json?auth='+TK,{method:'PUT',body:JSON.stringify({ts:Date.now(),json:JSON.stringify(D)})});
  if(!r.ok)throw 0;
  try{var ex=await (await fetch(A+'img.json?shallow=true&auth='+TK)).json();for(var id in (ex||{}))if(!used[id])fetch(A+'img/'+id+'.json?auth='+TK,{method:'DELETE'})}catch(z){}
  dirty=false;$('st').textContent='اتنشر ✅ العملاء هيشوفوه خلال ثواني';b.classList.remove('hot');toast('اتنشر ✅')}
 catch(e){D.v--;toast('مقدرش ينشر، سجّل دخول تاني (الجلسة بتنتهي بعد ساعة)')}
 b.disabled=false}
function enter(){$('lf').hidden=true;$('app').hidden=false;render()}
$('lf').onsubmit=async function(e){e.preventDefault();var er=$('le');er.textContent='';
 if(DEMO){if($('lu').value.trim()=='admin@demo.com'&&$('lp').value=='1234')enter();else er.textContent='الإيميل أو كلمة السر غلط';return}
 try{
  var r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('lu').value.trim(),password:$('lp').value,returnSecureToken:true})});
  var d=await r.json();if(!d.idToken){er.textContent='الإيميل أو كلمة السر غلط';return}
  TK=d.idToken;
  var v=await (await fetch('https://'+FB.db+'/chips/data.json')).json();
  if(v&&v.json)D=JSON.parse(v.json);
  await Promise.all(D.p.filter(function(p){return p[8]}).map(function(p){return fetch('https://'+FB.db+'/chips/img/'+p[8]+'.json').then(function(r){return r.json()}).then(function(x){if(x)IMG[p[8]]=x}).catch(function(){})}));
  enter()
 }catch(x){er.textContent='مفيش اتصال أو إعدادات Firebase ناقصة'}};
if(DEMO){$('lu').value='admin@demo.com';$('lp').value='1234'}
</script></body></html>
