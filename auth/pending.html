<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>حسابك قيد المراجعة – أبو سعيد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/auth.css">
</head>
<body>
  <header class="auth-top">
    <a class="brand-pill" href="/login">
      <span class="brand-mark"><img id="brandLogo" alt="شعار أبو سعيد"></span>
      <span class="brand-txt">
        <strong id="brandName">أبو سعيد</strong>
        <small id="brandSub">جملة الشيبسي والسناكس</small>
      </span>
    </a>
    <button id="themeToggle" class="icon-btn" type="button" aria-label="تبديل المظهر">🌙</button>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <div class="status-box">
        <div class="status-ico">⏳</div>
        <div class="status-pill">Pending · في انتظار موافقة الإدارة</div>
        <h2>حسابك قيد مراجعة الإدارة</h2>
        <p>تم إرسال طلب إنشاء حسابك بنجاح، وهو الآن قيد مراجعة الإدارة.</p>
        <div class="note-box">
          لا يمكن الدخول إلى المتجر أو مشاهدة المنتجات والأسعار قبل موافقة الإدارة وتفعيل الحساب.
        </div>
        <a class="btn-submit" href="/login">الذهاب لصفحة تسجيل الدخول</a>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      function applyTheme(theme) {
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute('data-theme', theme);
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        const isDark =
          theme === 'dark' ||
          (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        $('themeToggle').textContent = isDark ? '☀️' : '🌙';
      }
      try { applyTheme(localStorage.getItem('abu_theme') || ''); } catch (e) { applyTheme(''); }
      $('themeToggle').addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const next = cur === 'dark' || (!cur && prefersDark) ? 'light' : 'dark';
        try { localStorage.setItem('abu_theme', next); } catch (e) {}
        applyTheme(next);
      });
      fetch('/api/brand')
        .then((r) => r.json())
        .then((b) => {
          if (b.brandName) $('brandName').textContent = b.brandName;
          if (b.brandSub) $('brandSub').textContent = b.brandSub;
          if (b.logoData) $('brandLogo').src = b.logoData;
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
