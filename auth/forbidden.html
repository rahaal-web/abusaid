<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>غير مصرح – أبو سعيد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/auth.css">
</head>
<body>
  <header class="auth-top">
    <a class="brand-pill" href="/">
      <span class="brand-mark"><img id="brandLogo" alt="شعار أبو سعيد"></span>
      <span class="brand-txt">
        <strong id="brandName">أبو سعيد</strong>
        <small id="brandSub">جملة الشيبسي والسناكس</small>
      </span>
    </a>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <div class="status-box">
        <div class="status-ico suspended">🛡️</div>
        <div class="status-pill">403 · صلاحية الإدارة مطلوبة</div>
        <h2>غير مصرح لك بالوصول</h2>
        <p>هذه الصفحة مخصصة لإدارة المتجر فقط. حسابك الحالي حساب عميل ولا يملك صلاحيات الإدارة.</p>
        <a class="btn-submit" href="/">العودة إلى المتجر 🛍️</a>
      </div>
    </section>
  </main>

  <script>
    fetch('/api/brand')
      .then((r) => r.json())
      .then((b) => {
        if (b.brandName) document.getElementById('brandName').textContent = b.brandName;
        if (b.brandSub) document.getElementById('brandSub').textContent = b.brandSub;
        if (b.logoData) document.getElementById('brandLogo').src = b.logoData;
      })
      .catch(() => {});
  </script>
</body>
</html>
