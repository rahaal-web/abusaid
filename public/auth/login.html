<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تسجيل الدخول – أبو سعيد لتجارة الجملة</title>
  <meta name="description" content="تسجيل الدخول إلى متجر أبو سعيد لطلبات الجملة.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="/js/pwa.js"></script>
  <link rel="stylesheet" href="/styles/auth.css">
</head>
<body>
  <header class="auth-topbar">
    <div class="brand-chip">
      <span class="brand-chip-logo">
        <img id="brandLogo" alt="شعار أبو سعيد">
      </span>
      <span class="brand-chip-txt">
        <strong>أبو سعيد</strong>
        <small>جملة الشيبسي والسناكس</small>
      </span>
    </div>
    <button id="themeToggle" class="theme-btn" type="button" aria-label="تبديل المظهر" aria-pressed="false">🌙</button>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="loginTitle">
      <div class="auth-head">
        <span class="auth-badge">🔒 بوابة تجار الجملة المعتمدين</span>
        <h1 id="loginTitle">تسجيل الدخول</h1>
        <p>سجّل دخولك للوصول إلى قائمة الأصناف وأسعار الجملة والطلبات</p>
      </div>

      <div id="loginAlert" class="alert" role="alert" hidden></div>

      <div id="savedAccountsBox" class="saved-accounts" hidden>
        <div class="saved-accounts-head">
          <span>👤 الحسابات المحفوظة على هذا الجهاز</span>
        </div>
        <div id="savedAccountsList" class="saved-list"></div>
      </div>

      <form id="loginForm" method="post" action="/login" novalidate>
        <div class="field">
          <label for="identifier">رقم الهاتف <span class="opt">(أو البريد الإلكتروني)</span></label>
          <input
            id="identifier"
            name="identifier"
            type="text"
            dir="ltr"
            autocomplete="username"
            inputmode="tel"
            placeholder="01012345678"
            required
          >
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <div class="input-wrap">
            <input
              id="password"
              name="password"
              type="password"
              dir="ltr"
              class="has-eye"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            >
            <button type="button" class="eye-btn" data-eye="password" aria-label="إظهار أو إخفاء كلمة المرور">👁️</button>
          </div>
        </div>

        <div class="remember-row">
          <label class="remember-check" for="rememberMe">
            <input id="rememberMe" name="rememberMe" type="checkbox" checked>
            <span>حفظ الحساب والبقاء مسجلاً الدخول</span>
          </label>
        </div>

        <button id="loginBtn" type="submit" class="btn btn-primary" style="margin-top:4px">
          دخول إلى المتجر 🔓
        </button>
      </form>

      <div class="auth-foot">
        عميل جديد ومحتاج حساب جملة؟
        <a href="/register">إنشاء حساب جديد</a>
      </div>
    </section>
  </main>

  <footer class="auth-footer-credit">
    تصميم وتطوير <a href="https://wa.me/201060354779" target="_blank" rel="noopener noreferrer">احمد رحال</a> · <a href="/admin">دخول الإدارة</a>
  </footer>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
